<!doctype html>

    <head>
        <script>
        /* Canonical domain: force the bare apex domain onto www.masterliqours.my
           BEFORE anything else loads. This fixes:
           1. Google OAuth 'redirect_uri_mismatch' — the redirect URI is built from
              the current origin, so everyone must be on the ONE registered domain.
           2. The www vs non-www split where a stale service worker only poisoned
              the apex domain. Running this first means nobody stays on the apex. */
        (function () {
          try {
            if (location.hostname === 'masterliqours.my') {
              location.replace('https://www.masterliqours.my' + location.pathname + location.search + location.hash);
            }
          } catch (e) {}
        })();
        </script>
